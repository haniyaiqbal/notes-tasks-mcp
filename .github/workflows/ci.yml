name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mcp
          POSTGRES_PASSWORD: mcp
          POSTGRES_DB: mcp
        ports: ['5435:5432']
        options: >-
          --health-cmd "pg_isready -U mcp"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://mcp:mcp@localhost:5435/mcp
      APP_URL: http://localhost:3000
      COOKIE_SECRET: ci-only-cookie-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      # A fresh signing key for this run only.
      - name: Generate a signing key
        run: npm run -s keys:generate | grep OAUTH_SIGNING_KEY | sed "s/^OAUTH_SIGNING_KEY='\(.*\)'$/OAUTH_SIGNING_KEY=\1/" >> "$GITHUB_ENV"
      - name: Migrations match the entities
        run: npm run migration:run && npm run migration:check
      - run: npm run test:e2e
      - run: docker build -t notes-tasks-mcp .
